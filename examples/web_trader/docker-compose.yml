name: vnpy-web-trader

services:
  questdb:
    image: ${QUESTDB_IMAGE:-questdb/questdb:8.2.3}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/questdb:/var/lib/questdb
    expose:
      - "9000"
      - "8812"
      - "9009"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    image: vnpy-web-trader:4.4.0
    restart: unless-stopped
    depends_on:
      questdb:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
      LC_CTYPE: zh_CN.UTF-8
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8000"
      WEB_USERNAME: ${WEB_USERNAME:-vnpy}
      WEB_PASSWORD: ${WEB_PASSWORD:-vnpy}
      WEB_SECRET_KEY: ${WEB_SECRET_KEY:-}
      LIVE_IRON_CONDOR: ${LIVE_IRON_CONDOR:-0}
      LIVE_DRY_RUN: ${LIVE_DRY_RUN:-1}
      LIVE_PORTFOLIOS: ${LIVE_PORTFOLIOS:-IO.CFFEX}
      LIVE_GATEWAY: ${LIVE_GATEWAY:-CTP}
      LIVE_SCRIPT: ${LIVE_SCRIPT:-gex_tv_strangle.py}
      LIVE_WING_STEPS: ${LIVE_WING_STEPS:-}
      LIVE_MIN_CREDIT_FRAC: ${LIVE_MIN_CREDIT_FRAC:-}
      LIVE_MIN_DELTA: ${LIVE_MIN_DELTA:-}
      LIVE_MAX_DELTA: ${LIVE_MAX_DELTA:-}
      LIVE_RISK_CAP: ${LIVE_RISK_CAP:-}
      LIVE_MAX_LOTS: ${LIVE_MAX_LOTS:-}
      LIVE_IV_RANK_MIN: ${LIVE_IV_RANK_MIN:-}
      LIVE_TAKE_PROFIT: ${LIVE_TAKE_PROFIT:-}
      DATABASE_DRIVER: questdb
      DATABASE_HOST: questdb
      DATABASE_PORT: "8812"
      DATABASE_HTTP_PORT: "9000"
      DATABASE_NAME: ${DATABASE_NAME:-qdb}
      DATABASE_USER: ${DATABASE_USER:-admin}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-quest}
    volumes:
      - ./data/vntrader:/root/.vntrader
      - ./run_server.py:/app/run_server.py
      - ./server.py:/app/server.py
      - ./scripts:/app/scripts
      - ./static:/app/static
    ports:
      - "${WEB_PUBLISH_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["python", "run_server.py"]
